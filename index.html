<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniTube</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="logo">
    <span class="logo-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5.2v13.6L19 12 8 5.2z"></path>
      </svg>
    </span>
    <span>MiniTube</span>
  </div>

  <div class="search-area">

    <input
      type="text"
      id="searchInput"
      placeholder="Search"
      autocomplete="off"
    >

    <button id="searchButton" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.3"></circle>
        <path d="M16 16l5 5"></path>
      </svg>
    </button>

  </div>


  <!-- AUTH BUTTONS -->

  <div class="auth-buttons" id="authButtons">

    <button id="loginButton">
      Sign in
    </button>

    <button id="signupButton">
      Create account
    </button>

  </div>


  <!-- PROFILE -->

  <div class="profile-area" id="profileArea" style="display:none;">

    <button
      class="profile-button"
      id="profileButton"
      aria-label="Profile"
    >
      <img
        id="headerProfilePhoto"
        src=""
        alt="Profile"
      >
    </button>


    <div class="profile-menu" id="profileMenu">

      <button id="editProfileButton">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24">
            <path d="M4 20h4L19 9l-4-4L4 16v4z"></path>
            <path d="M13.5 6.5l4 4"></path>
          </svg>
        </span>
        Edit profile
      </button>

      <button id="myChannelButton">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.2"></circle>
            <path d="M5 20c.7-3.8 3-5.7 7-5.7s6.3 1.9 7 5.7"></path>
          </svg>
        </span>
        My channel
      </button>

      <button id="uploadButton">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 16V4"></path>
            <path d="M7 9l5-5 5 5"></path>
            <path d="M5 20h14"></path>
          </svg>
        </span>
        Upload video
      </button>

      <button id="logoutButton">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24">
            <path d="M10 5H5v14h5"></path>
            <path d="M14 8l4 4-4 4"></path>
            <path d="M18 12H9"></path>
          </svg>
        </span>
        Log out
      </button>

    </div>

  </div>

</header>


<!-- =====================================================
     CATEGORIES
===================================================== -->

<nav class="categories">

  <button class="category-btn active" data-category="All">
    All
  </button>

  <button class="category-btn" data-category="Gaming">
    Gaming
  </button>

  <button class="category-btn" data-category="Islamic">
    Islamic
  </button>

  <button class="category-btn" data-category="Education">
    Education
  </button>

  <button class="category-btn" data-category="Entertainment">
    Entertainment
  </button>

  <button class="category-btn" data-category="Sports">
    Sports
  </button>

  <button class="category-btn" data-category="News">
    News
  </button>

  <button class="category-btn" data-category="Music">
    Music
  </button>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


  <!-- ===================================================
       HOME
  ==================================================== -->

  <section id="homePage">

    <div class="hero">

      <div class="hero-icon">
        <svg viewBox="0 0 24 24">
          <path d="M8 5.2v13.6L19 12 8 5.2z"></path>
        </svg>
      </div>

      <div>
        <h1>Welcome to MiniTube</h1>
        <p>
          Watch, discover and share amazing videos.
        </p>
      </div>

    </div>


    <div
      class="video-grid"
      id="videoGrid"
    ></div>

  </section>



  <!-- ===================================================
       VIDEO PAGE
  ==================================================== -->

  <section
    id="videoPage"
    class="video-page"
  >

    <button id="backHomeButton" class="back-button">

      <svg viewBox="0 0 24 24">
        <path d="M19 12H5"></path>
        <path d="M11 18l-6-6 6-6"></path>
      </svg>

      <span>Back</span>

    </button>


    <div class="video-player-box">

      <video
        id="mainVideo"
        controls
        playsinline
      ></video>

    </div>


    <h1
      id="videoPageTitle"
      class="video-page-title"
    ></h1>


    <div
      id="videoPageMeta"
      class="video-page-meta"
    ></div>


    <!-- ACTIONS -->

    <div class="video-actions">

      <button id="likeButton">

        <svg viewBox="0 0 24 24">
          <path d="M7 10v10H4V10h3z"></path>
          <path d="M7 10l4-7c.4-.7 1.5-.4 1.5.4V8h5.2c1.3 0 2.1 1.2 1.7 2.4l-1.5 6.3c-.3 1.1-1.2 1.8-2.3 1.8H7"></path>
        </svg>

        <span>Like</span>

        <span id="likeCount">0</span>

      </button>


      <button id="shareButton">

        <svg viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="2.5"></circle>
          <circle cx="6" cy="12" r="2.5"></circle>
          <circle cx="18" cy="19" r="2.5"></circle>
          <path d="M8.3 10.8l7.4-4.5"></path>
          <path d="M8.3 13.2l7.4 4.5"></path>
        </svg>

        <span>Share</span>

      </button>


      <a
        id="downloadButton"
        href="#"
        download
      >

        <svg viewBox="0 0 24 24">
          <path d="M12 4v11"></path>
          <path d="M7 11l5 5 5-5"></path>
          <path d="M5 20h14"></path>
        </svg>

        <span>Download</span>

      </a>


      <button
        class="video-more-page-button"
        id="videoPageMoreButton"
        aria-label="More options"
      >

        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.7"></circle>
          <circle cx="12" cy="12" r="1.7"></circle>
          <circle cx="19" cy="12" r="1.7"></circle>
        </svg>

      </button>

    </div>


    <!-- CREATOR -->

    <div class="creator-box">

      <img
        id="creatorPhoto"
        src=""
        alt="Creator"
      >

      <div>

        <strong id="creatorName"></strong>

        <div id="creatorUsername"></div>

      </div>

    </div>


    <!-- DESCRIPTION -->

    <div
      class="description-box"
      id="videoDescription"
    ></div>


    <!-- COMMENTS -->

    <div class="comments-section">

      <h2>Comments</h2>

      <div class="comment-input-area">

        <input
          id="commentInput"
          type="text"
          placeholder="Add a comment..."
          autocomplete="off"
        >

        <button id="commentButton">
          Comment
        </button>

      </div>

      <div id="commentsList"></div>

    </div>

  </section>



  <!-- ===================================================
       CHANNEL PAGE
  ==================================================== -->

  <section
    id="channelPage"
    class="channel-page"
  >

    <button
      id="channelBackButton"
      class="back-button"
    >

      <svg viewBox="0 0 24 24">
        <path d="M19 12H5"></path>
        <path d="M11 18l-6-6 6-6"></path>
      </svg>

      <span>Back</span>

    </button>


    <div class="channel-header">

      <div class="channel-profile">

        <img
          id="channelPhoto"
          src=""
          alt="Channel"
        >

        <div>

          <div
            id="channelName"
            class="channel-name"
          ></div>

          <div
            id="channelUsername"
            class="channel-username"
          ></div>

          <div
            id="channelBio"
            class="channel-bio"
          ></div>

          <a
            id="channelLink"
            class="channel-link"
            href="#"
            target="_blank"
            rel="noopener"
          ></a>

        </div>

      </div>

    </div>


    <div
      class="video-grid"
      id="channelVideoGrid"
    ></div>

  </section>



  <!-- ===================================================
       UPLOAD PAGE
  ==================================================== -->

  <section
    id="uploadPage"
    class="upload-page"
  >

    <button
      id="uploadBackButton"
      class="back-button"
    >

      <svg viewBox="0 0 24 24">
        <path d="M19 12H5"></path>
        <path d="M11 18l-6-6 6-6"></path>
      </svg>

      <span>Back</span>

    </button>


    <div class="upload-header">

      <div class="upload-title-icon">

        <svg viewBox="0 0 24 24">
          <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11z"></path>
          <path d="M10 8.5l6 3.5-6 3.5v-7z"></path>
        </svg>

      </div>

      <div>
        <h2>Upload Video</h2>
        <p>Share your video with MiniTube.</p>
      </div>

    </div>


    <label class="upload-label">
      Video file
    </label>

    <input
      id="videoFile"
      class="upload-input"
      type="file"
      accept="video/*"
    >


    <label class="upload-label">
      Title
    </label>

    <input
      id="videoTitle"
      class="upload-input"
      type="text"
      placeholder="Enter video title"
    >


    <label class="upload-label">
      Description
    </label>

    <textarea
      id="videoDescriptionInput"
      class="upload-textarea"
      placeholder="Tell viewers about your video..."
    ></textarea>


    <label class="upload-label">
      Category
    </label>

    <select
      id="videoCategory"
      class="upload-select"
    >

      <option value="Gaming">Gaming</option>
      <option value="Islamic">Islamic</option>
      <option value="Education">Education</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Sports">Sports</option>
      <option value="News">News</option>
      <option value="Music">Music</option>

    </select>


    <button
      id="uploadVideoButton"
      class="upload-button"
    >

      <svg viewBox="0 0 24 24">
        <path d="M12 16V4"></path>
        <path d="M7 9l5-5 5 5"></path>
        <path d="M5 20h14"></path>
      </svg>

      <span>Upload Video</span>

    </button>


    <div
      id="uploadStatus"
      class="upload-status"
    ></div>

  </section>

</main>



<!-- =====================================================
     EDIT PROFILE MODAL
===================================================== -->

<div
  class="modal"
  id="editProfileModal"
>

  <div class="modal-box">

    <button
      id="closeEditProfile"
      class="close-modal"
      aria-label="Close"
    >
      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12"></path>
        <path d="M18 6L6 18"></path>
      </svg>
    </button>


    <h2>Edit Profile</h2>


    <div class="edit-photo-area">

      <img
        id="editProfilePreview"
        class="edit-profile-preview"
        src=""
        alt="Profile preview"
      >

      <button
        id="changePhotoButton"
        class="change-photo-btn"
      >
        Change photo
      </button>

      <input
        id="profileImageFile"
        type="file"
        accept="image/*"
        hidden
      >

    </div>


    <label class="edit-label">
      Username
    </label>

    <input
      id="editUsername"
      class="edit-input"
      type="text"
    >


    <label class="edit-label">
      Channel name
    </label>

    <input
      id="editChannelName"
      class="edit-input"
      type="text"
    >


    <label class="edit-label">
      Bio
    </label>

    <textarea
      id="editBio"
      class="edit-bio"
    ></textarea>


    <label class="edit-label">
      Link
    </label>

    <input
      id="editLink"
      class="edit-input"
      type="text"
      placeholder="https://example.com"
    >


    <button
      id="saveProfileButton"
      class="save-profile-btn"
    >
      Save changes
    </button>


    <div
      id="profileSaveStatus"
      class="profile-save-status"
    ></div>

  </div>

</div>



<!-- =====================================================
     LOGIN MODAL
===================================================== -->

<div
  class="modal"
  id="loginModal"
>

  <div class="modal-box">

    <button
      id="closeLogin"
      class="close-modal"
      aria-label="Close"
    >
      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12"></path>
        <path d="M18 6L6 18"></path>
      </svg>
    </button>


    <div class="modal-heading-icon">

      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3"></circle>
        <path d="M5 20c.8-3.8 3.1-5.7 7-5.7s6.2 1.9 7 5.7"></path>
      </svg>

    </div>


    <h2>Sign in</h2>


    <input
      id="loginEmail"
      class="auth-input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      id="loginPassword"
      class="auth-input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      id="emailLoginButton"
      class="auth-main-button"
    >
      Sign in
    </button>


    <button
      id="googleLoginButton"
      class="google-button"
    >

      <span class="google-icon">G</span>
      Continue with Google

    </button>


    <div
      id="loginStatus"
      class="auth-status"
    ></div>

  </div>

</div>



<!-- =====================================================
     SIGNUP MODAL
===================================================== -->

<div
  class="modal"
  id="signupModal"
>

  <div class="modal-box">

    <button
      id="closeSignup"
      class="close-modal"
      aria-label="Close"
    >
      <svg viewBox="0 0 24 24">
        <path d="M6 6l12 12"></path>
        <path d="M18 6L6 18"></path>
      </svg>
    </button>


    <div class="modal-heading-icon">

      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3"></circle>
        <path d="M5 20c.8-3.8 3.1-5.7 7-5.7s6.2 1.9 7 5.7"></path>
        <path d="M19 4v5"></path>
        <path d="M16.5 6.5h5"></path>
      </svg>

    </div>


    <h2>Create account</h2>


    <input
      id="signupName"
      class="auth-input"
      type="text"
      placeholder="Name"
      autocomplete="name"
    >


    <input
      id="signupEmail"
      class="auth-input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      id="signupPassword"
      class="auth-input"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >


    <button
      id="emailSignupButton"
      class="auth-main-button"
    >
      Create account
    </button>


    <button
      id="googleSignupButton"
      class="google-button"
    >

      <span class="google-icon">G</span>
      Continue with Google

    </button>


    <div
      id="signupStatus"
      class="auth-status"
    ></div>

  </div>

</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    serverTimestamp,
    updateDoc,
    deleteDoc,
    increment
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBBc_Ihgyl0-P7u_K6p0GKXkVpT2v5674Q",
    authDomain: "minitube-9317a.firebaseapp.com",
    projectId: "minitube-9317a",
    storageBucket: "minitube-9317a.firebasestorage.app",
    messagingSenderId: "176876768704",
    appId: "1:176876768704:web:051bd6a6ba27325e22cc25"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const googleProvider = new GoogleAuthProvider();


  window.firebaseFunctions = {

    auth,
    db,
    googleProvider,

    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,

    signInWithPopup,

    onAuthStateChanged,

    signOut,

    updateProfile,

    doc,
    setDoc,
    getDoc,

    collection,
    addDoc,
    getDocs,

    query,
    orderBy,

    serverTimestamp,

    updateDoc,
    deleteDoc,

    increment

  };

</script>


<script src="script.js"></script>

</body>
</html>
