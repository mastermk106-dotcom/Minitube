<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MiniTube</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="logo">▶ MiniTube</div>

  <div class="search-area">
    <input
      type="text"
      id="searchInput"
      placeholder="Search MiniTube..."
    >
    <button id="searchButton">🔍</button>
  </div>

  <div class="auth-buttons" id="authButtons">
    <button id="loginButton">Login</button>
    <button id="signupButton">Sign Up</button>
  </div>

  <div class="profile-area" id="profileArea" style="display:none;">

    <button class="profile-button" id="profileButton">
      <img id="headerProfilePhoto"
           src="https://ui-avatars.com/api/?name=User"
           alt="Profile">
    </button>

    <div class="profile-menu" id="profileMenu">

      <button id="editProfileButton">
        ✏️ Edit Profile
      </button>

      <button id="myChannelButton">
        👤 My Channel
      </button>

      <button id="uploadButton">
        ⬆️ Upload Video
      </button>

      <button id="logoutButton">
        🚪 Logout
      </button>

    </div>

  </div>

</header>


<!-- ================= CATEGORIES ================= -->

<div class="categories">

  <button class="category-btn active" data-category="All">
    All
  </button>

  <button class="category-btn" data-category="Gaming">
    Gaming
  </button>

  <button class="category-btn" data-category="Islamic">
    Islamic
  </button>

  <button class="category-btn" data-category="Education">
    Education
  </button>

  <button class="category-btn" data-category="Entertainment">
    Entertainment
  </button>

  <button class="category-btn" data-category="Sports">
    Sports
  </button>

  <button class="category-btn" data-category="News">
    News
  </button>

  <button class="category-btn" data-category="Music">
    Music
  </button>

</div>


<!-- ================= HOME ================= -->

<main id="homePage">

  <section class="hero">

    <h1>Welcome to MiniTube 🎬</h1>

    <p>
      Watch, upload and share your favorite videos.
    </p>

  </section>

  <div id="videoGrid" class="video-grid"></div>

</main>


<!-- ================= VIDEO PAGE ================= -->

<main id="videoPage" class="video-page">

  <button id="backHomeButton">
    ← Back
  </button>

  <br><br>

  <div class="video-player-box">

    <video
      id="mainVideo"
      controls
      playsinline
    ></video>

  </div>

  <h1
    id="videoPageTitle"
    class="video-page-title"
  ></h1>

  <div
    id="videoPageMeta"
    class="video-page-meta"
  ></div>

  <div class="video-actions">

    <button id="likeButton">
      👍 Like <span id="likeCount">0</span>
    </button>

    <button id="shareButton">
      🔗 Share
    </button>

    <a
      id="downloadButton"
      href="#"
      download
      target="_blank"
    >
      ⬇️ Download
    </a>

  </div>

  <div class="creator-box">

    <img
      id="creatorPhoto"
      src="https://ui-avatars.com/api/?name=User"
      alt="Creator"
    >

    <div>
      <strong id="creatorName"></strong>
      <div id="creatorUsername"></div>
    </div>

  </div>

  <div
    id="videoDescription"
    class="description-box"
  ></div>


  <!-- COMMENTS -->

  <section class="comments-section">

    <h2>Comments</h2>

    <div class="comment-input-area">

      <input
        id="commentInput"
        type="text"
        placeholder="Write a comment..."
      >

      <button id="commentButton">
        Comment
      </button>

    </div>

    <div id="commentsList"></div>

  </section>

</main>


<!-- ================= CHANNEL ================= -->

<main id="channelPage" class="channel-page">

  <button id="channelBackButton">
    ← Back
  </button>

  <br><br>

  <div class="channel-header">

    <div class="channel-profile">

      <img
        id="channelPhoto"
        src="https://ui-avatars.com/api/?name=User"
        alt="Channel"
      >

      <div>

        <div
          id="channelName"
          class="channel-name"
        ></div>

        <div
          id="channelUsername"
          class="channel-username"
        ></div>

        <div
          id="channelBio"
          class="channel-bio"
        ></div>

        <a
          id="channelLink"
          class="channel-link"
          href="#"
          target="_blank"
        ></a>

      </div>

    </div>

  </div>

  <h2>My Videos</h2>

  <br>

  <div
    id="channelVideoGrid"
    class="video-grid"
  ></div>

</main>


<!-- ================= UPLOAD PAGE ================= -->

<main id="uploadPage" class="upload-page">

  <button id="uploadBackButton">
    ← Back
  </button>

  <br><br>

  <h2>Upload Video 🎬</h2>

  <label class="upload-label">
    Video File
  </label>

  <input
    type="file"
    id="videoFile"
    class="upload-input"
    accept="video/*"
  >

  <label class="upload-label">
    Title
  </label>

  <input
    type="text"
    id="videoTitle"
    class="upload-input"
    placeholder="Video title"
  >

  <label class="upload-label">
    Description
  </label>

  <textarea
    id="videoDescriptionInput"
    class="upload-textarea"
    placeholder="Video description"
  ></textarea>

  <label class="upload-label">
    Category
  </label>

  <select
    id="videoCategory"
    class="upload-select"
  >

    <option value="Gaming">Gaming</option>
    <option value="Islamic">Islamic</option>
    <option value="Education">Education</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Sports">Sports</option>
    <option value="News">News</option>
    <option value="Music">Music</option>

  </select>

  <button
    id="uploadVideoButton"
    class="upload-button"
  >
    Upload Video
  </button>

  <div id="uploadStatus"></div>

</main>


<!-- ================= EDIT PROFILE MODAL ================= -->

<div
  id="editProfileModal"
  class="modal"
>

  <div class="modal-box profile-edit-box">

    <button
      class="close-modal"
      id="closeEditProfile"
    >
      ×
    </button>

    <h2>Edit Profile</h2>

    <div class="edit-photo-area">

      <img
        id="editProfilePreview"
        class="edit-profile-preview"
        src="https://ui-avatars.com/api/?name=User"
        alt="Profile"
      >

      <input
        type="file"
        id="profileImageFile"
        accept="image/*"
        hidden
      >

      <button
        class="change-photo-btn"
        id="changePhotoButton"
      >
        Change Photo
      </button>

    </div>

    <label class="edit-label">
      Username
    </label>

    <input
      id="editUsername"
      class="edit-input"
      type="text"
      placeholder="@username"
    >

    <label class="edit-label">
      Channel Name
    </label>

    <input
      id="editChannelName"
      class="edit-input"
      type="text"
      placeholder="Channel name"
    >

    <label class="edit-label">
      Bio
    </label>

    <textarea
      id="editBio"
      class="edit-bio"
      placeholder="Tell people about yourself..."
    ></textarea>

    <label class="edit-label">
      Link
    </label>

    <input
      id="editLink"
      class="edit-input"
      type="text"
      placeholder="https://..."
    >

    <button
      id="saveProfileButton"
      class="save-profile-btn"
    >
      Save Profile
    </button>

    <div id="profileSaveStatus"></div>

  </div>

</div>


<!-- ================= LOGIN MODAL ================= -->

<div
  id="loginModal"
  class="modal"
>

  <div class="modal-box auth-box">

    <button
      class="close-modal"
      id="closeLogin"
    >
      ×
    </button>

    <h2>Login</h2>

    <input
      id="loginEmail"
      class="auth-input"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      class="auth-input"
      type="password"
      placeholder="Password"
    >

    <button
      id="emailLoginButton"
      class="auth-main-button"
    >
      Login
    </button>

    <button
      id="googleLoginButton"
      class="google-button"
    >
      Continue with Google
    </button>

    <div
      id="loginStatus"
      class="auth-status"
    ></div>

  </div>

</div>


<!-- ================= SIGNUP MODAL ================= -->

<div
  id="signupModal"
  class="modal"
>

  <div class="modal-box auth-box">

    <button
      class="close-modal"
      id="closeSignup"
    >
      ×
    </button>

    <h2>Create Account</h2>

    <input
      id="signupName"
      class="auth-input"
      type="text"
      placeholder="Your name"
    >

    <input
      id="signupEmail"
      class="auth-input"
      type="email"
      placeholder="Email"
    >

    <input
      id="signupPassword"
      class="auth-input"
      type="password"
      placeholder="Password"
    >

    <button
      id="emailSignupButton"
      class="auth-main-button"
    >
      Sign Up
    </button>

    <button
      id="googleSignupButton"
      class="google-button"
    >
      Continue with Google
    </button>

    <div
      id="signupStatus"
      class="auth-status"
    ></div>

  </div>

</div>


<!-- Firebase -->

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    increment,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyBBc_Ihgyl0-P7u_K6p0GKXkVpT2v5674Q",
    authDomain: "minitube-9317a.firebaseapp.com",
    projectId: "minitube-9317a",
    storageBucket: "minitube-9317a.firebasestorage.app",
    messagingSenderId: "176876768704",
    appId: "1:176876768704:web:051bd6a6ba27325e22cc25"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const googleProvider = new GoogleAuthProvider();


  window.firebaseFunctions = {

    auth,
    db,
    googleProvider,

    signInWithPopup,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    updateProfile,

    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    increment,
    query,
    orderBy,
    serverTimestamp
  };

</script>

<script src="script.js"></script>

</body>
</html>
